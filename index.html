     build.py replaces the GRX:* markers with design tokens, per-tab CSS, the
     bottom nav, and one <script src="tabs/<tab>.js"> per tab. -->

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161a44">

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ---- design tokens (from design/tokens.css) ---- */
/* GrantReady — design tokens v1 "Award Letter".
   Owned by the spa-design session. The hub inlines this into shell.html at build time.
   Every tab styles through these tokens; edit values here to re-skin the whole app.
   See design/design.md for the system, the motifs and the do/don't list.

   Idea: a grants office after hours. Ink-indigo ground, cool paper, and one gold
   "seal" colour for progress. The signature mark is the accounting double rule
   (the line drawn under a final total), used as a quiet divider and in the icon.

   Token names that existed before v1 are kept as-is; the rest are additions. */

:root {
  color-scheme: light;

  /* ---- neutrals (cool, indigo-leaning, never pure grey) ---- */
  --ink:        #17192e;   /* primary text */
  --ink-soft:   #50546e;   /* secondary text (7:1 on card) */
  --ink-faint:  #7a7e99;   /* hints, disabled, decorative only (not for body text) */
  --paper:      #f3f4f9;   /* app background */
  --card:       #ffffff;   /* raised surfaces */
  --rule:       #dfe1ec;   /* hairlines, card borders */
  --rule-strong:#c3c7d9;   /* inputs, dividers that must be seen */

  /* ---- primary: ink indigo ---- */
  --brand:      #3340a0;   /* links, active tab, primary buttons (8.8:1 on card) */
  --brand-deep: #161a44;   /* header + hero ground; ALWAYS a dark ground, both themes */
  --brand-soft: #e4e7f8;   /* tint fill behind brand-coloured things */
  --on-soft:    #1f2872;   /* text/icon sitting on --brand-soft (use this, not --brand-deep) */
  --on-brand:   #ffffff;   /* text on a solid --brand fill */

  /* ---- ground text: for anything sitting on --brand-deep ---- */
  --on-deep:      #ffffff;
  --on-deep-soft: #b4bbe4;

  /* ---- warm / progress: the gold seal ---- */
  --ember:      #d49a1f;   /* progress fills, "now", streaks, highlights on --brand-deep */
  --ember-ink:  #8a5200;   /* the same gold as TEXT on light surfaces (5.6:1) */
  --ember-soft: #fbefd0;   /* tint fill */

  /* ---- semantic ---- */
  --good:       #1d7548;   /* done / correct */
  --good-soft:  #dcf1e4;
  --warn:       #b2432a;   /* attention / incorrect */
  --warn-soft:  #fbe3dc;
  --focus:      #3340a0;   /* focus ring colour */

  /* ---- type: Newsreader (display) · Public Sans (body) · IBM Plex Mono (figures) ---- */
  --display: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body:    "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* type scale (rem; 1rem = 16px). Body copy is --fs-base. */
  --fs-xs:   .72rem;   /* eyebrows, pills, captions (uppercase + tracking) */
  --fs-sm:   .84rem;   /* secondary text, tab-bar labels */
  --fs-base: 1rem;     /* body */
  --fs-md:   1.125rem; /* lead paragraphs, card titles */
  --fs-lg:   1.35rem;  /* section headings (h3) */
  --fs-xl:   1.7rem;   /* tab headings (h2) */
  --fs-2xl:  2.2rem;   /* hero numbers / countdown */
  --lh-tight: 1.15;
  --lh-body:  1.55;
  --track-label: .08em; /* letter-spacing for uppercase labels */

  /* ---- space, shape, depth ---- */
  --u: 8px;                /* spacing unit; use calc(var(--u)*n) */
  --maxw: 640px;           /* content column */
  --radius: 14px;          /* cards */
  --radius-sm: 8px;        /* inputs, chips, small buttons */
  --radius-pill: 999px;
  --tap: 44px;             /* minimum touch target */
  --shadow: 0 1px 2px rgba(23, 25, 46, .06), 0 6px 20px -8px rgba(23, 25, 46, .14);
  --seal-glow: 0 0 0 3px rgba(212, 154, 31, .22);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink:        #ecedf7;
    --ink-soft:   #a6aac8;
    --ink-faint:  #7d82a6;
    --paper:      #0e1022;
    --card:       #171a35;
    --rule:       #272b50;
    --rule-strong:#3a3f6c;

    --brand:      #9aa5ff;
    --brand-deep: #090b1a;
    --brand-soft: #262b5e;
    --on-soft:    #d5daff;
    --on-brand:   #0e1022;

    --on-deep:      #ffffff;
    --on-deep-soft: #a6aac8;

    --ember:      #e8b04a;
    --ember-ink:  #e8b04a;
    --ember-soft: #3a2f14;

    --good:       #5cc48c;
    --good-soft:  #16332a;
    --warn:       #f28e6c;
    --warn-soft:  #3b2019;
    --focus:      #9aa5ff;

    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -8px rgba(0, 0, 0, .55);
    --seal-glow: 0 0 0 3px rgba(232, 176, 74, .25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink:        #ecedf7;
  --ink-soft:   #a6aac8;
  --ink-faint:  #7d82a6;
  --paper:      #0e1022;
  --card:       #171a35;
  --rule:       #272b50;
  --rule-strong:#3a3f6c;

  --brand:      #9aa5ff;
  --brand-deep: #090b1a;
  --brand-soft: #262b5e;
  --on-soft:    #d5daff;
  --on-brand:   #0e1022;

  --on-deep:      #ffffff;
  --on-deep-soft: #a6aac8;

  --ember:      #e8b04a;
  --ember-ink:  #e8b04a;
  --ember-soft: #3a2f14;

  --good:       #5cc48c;
  --good-soft:  #16332a;
  --warn:       #f28e6c;
  --warn-soft:  #3b2019;
  --focus:      #9aa5ff;

  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -8px rgba(0, 0, 0, .55);
  --seal-glow: 0 0 0 3px rgba(232, 176, 74, .25);
}

/* ---- shared helpers (all prefixed gr-; safe to use from any tab) ---- */
body { font-size: var(--fs-base); line-height: var(--lh-body); font-optical-sizing: auto; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* digits that line up: money, percentages, dates in lists */
.gr-num { font-variant-numeric: tabular-nums lining-nums; }
/* worked figures and formulas (MTDC base, F&A, person-months) */
.gr-figure { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .94em; letter-spacing: -.01em; }
/* small uppercase label above a heading */
.gr-eyebrow { font-family: var(--body); font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-soft); margin: 0 0 calc(var(--u)*.75); }
/* the signature: the accounting double rule under a final total */
.gr-total { border: 0; height: 5px; margin: calc(var(--u)*2) 0; background:
  linear-gradient(var(--ember), var(--ember)) 0 0 / 100% 1.5px no-repeat,
  linear-gradient(var(--ember), var(--ember)) 0 100% / 100% 1.5px no-repeat; }
/* small result chips */
.gr-chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--brand-soft); color: var(--on-soft); }
.gr-chip.good { background: var(--good-soft); color: var(--good); }
.gr-chip.warn { background: var(--warn-soft); color: var(--warn); }
.gr-chip.seal { background: var(--ember-soft); color: var(--ember-ink); }
/* primary / quiet buttons that meet the 44px rule */
.gr-btn { appearance: none; border: 0; cursor: pointer; min-height: var(--tap); padding: 0 calc(var(--u)*2.5); border-radius: var(--radius-sm); font: 600 var(--fs-base)/1 var(--body); background: var(--brand); color: var(--on-brand); }
.gr-btn.quiet { background: var(--brand-soft); color: var(--on-soft); }
.gr-btn:active { transform: translateY(1px); }

/* ---- base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0 0 calc(var(--u)*1.5); }
a { color: var(--brand); }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 calc(var(--u)*2); }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--brand-deep); color: var(--on-deep);
  padding: calc(var(--u)*1.25) 0 calc(var(--u)*1.25);
  padding-top: calc(env(safe-area-inset-top) + var(--u)*1.25);
}
.topbar .wrap { display: flex; align-items: center; gap: calc(var(--u)*1.25); }
.topbar .mark { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; }
.topbar h1 { font-size: 1.15rem; margin: 0; color: var(--on-deep); letter-spacing: .2px; }
.topbar .sub { margin-left: auto; font-size: .72rem; color: var(--on-deep-soft); font-family: var(--body); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }

/* ---- panels ---- */
main { padding: calc(var(--u)*2.5) 0 calc(var(--u)*12); }  /* room for bottom nav */
.panel { display: none; }
.panel.on { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.muted { color: var(--ink-soft); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: calc(var(--u)*2); margin: 0 0 calc(var(--u)*1.5); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--on-soft); }
.stub { text-align: center; color: var(--ink-soft); padding: calc(var(--u)*5) var(--u); }
.stub .big { font-size: 2.4rem; display: block; margin-bottom: var(--u); }

/* ---- bottom nav ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar .row { max-width: var(--maxw); margin: 0 auto; display: flex; }
.tabbar button {
  flex: 1 1 0; min-width: 0; appearance: none; border: 0; background: none;
  color: var(--ink-soft); font-family: var(--body); font-size: .62rem; font-weight: 600;
  padding: calc(var(--u)*0.9) 2px calc(var(--u)*1.1); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabbar button .ic { font-size: 1.15rem; line-height: 1; }
.tabbar button[aria-current="true"] { color: var(--brand); }
.tabbar button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: 8px; }
/* ---- per-tab css (owned by each tab session) ---- */
/* === home === */
[data-panel="home"] .hm-hero { margin-bottom: calc(var(--u)*2); }
[data-panel="home"] .hm-hero h2 { font-size: 2rem; margin-bottom: 4px; }
[data-panel="home"] .hm-next {
  background: linear-gradient(140deg, var(--brand-deep), color-mix(in srgb, var(--brand-deep) 70%, var(--brand)));
  color: #fff; border-radius: var(--radius); padding: calc(var(--u)*2.5) calc(var(--u)*2);
  margin-bottom: calc(var(--u)*1.5);
}
[data-panel="home"] .hm-when { font-size: .74rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ember); }
[data-panel="home"] .hm-title { font-family: var(--display); font-size: 1.45rem; font-weight: 600; margin: 4px 0; }
[data-panel="home"] .hm-meta { font-size: .85rem; color: #c3d4ec; }
[data-panel="home"] .hm-sign { margin-top: calc(var(--u)*1.5); font-size: .82rem; line-height: 1.45; background: rgba(255,255,255,.12); padding: calc(var(--u)*1.25); border-radius: 10px; }
[data-panel="home"] .hm-sign b { color: #fff; }
[data-panel="home"] .hm-prog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: calc(var(--u)*1.5); font-size: .85rem; }
[data-panel="home"] .hm-dots { display: flex; gap: var(--u); }
[data-panel="home"] .hm-dot { flex: 1 1 0; aspect-ratio: 1; border-radius: 10px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; border: 1px solid var(--rule); }
[data-panel="home"] .hm-dot.past { background: var(--good); }
[data-panel="home"] .hm-dot.past .hm-code { color: #fff; }
[data-panel="home"] .hm-dot.now { background: var(--ember); border-color: var(--ember); }
[data-panel="home"] .hm-dot.now .hm-code { color: #3a2300; }
[data-panel="home"] .hm-code { font-size: .72rem; font-weight: 700; color: var(--on-soft); }
[data-panel="home"] .hm-tip { font-size: .88rem; }
[data-panel="home"] .hm-foot { font-size: .76rem; margin-top: calc(var(--u)*2); }

/* === content === */
/* content — owned by spa-content. Everything scoped under [data-panel="content"]; colours via tokens only. */
[data-panel="content"] [hidden] { display: none !important; }
[data-panel="content"] button { font-family: var(--body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
[data-panel="content"] button:focus-visible,
[data-panel="content"] input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[data-panel="content"] .ct-head h2 { font-size: 2rem; margin-bottom: 4px; }
[data-panel="content"] .ct-head p { margin: 0 0 calc(var(--u)*2); font-size: .92rem; }

/* view switch */
[data-panel="content"] .ct-seg { display: flex; gap: 4px; padding: 4px; margin-bottom: calc(var(--u)*2); background: var(--brand-soft); border-radius: 999px; }
[data-panel="content"] .ct-seg button { flex: 1 1 0; min-height: 44px; border: 0; border-radius: 999px; background: transparent; font-size: .92rem; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
[data-panel="content"] .ct-seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
[data-panel="content"] .ct-n { font-size: .72rem; font-weight: 700; margin-left: 4px; color: var(--ink-soft); }

/* session chips */
[data-panel="content"] .ct-chips { display: flex; gap: var(--u); overflow-x: auto; padding: 2px 2px calc(var(--u)*1.25); margin: 0 calc(var(--u)*-2); padding-left: calc(var(--u)*2); padding-right: calc(var(--u)*2); scroll-snap-type: x proximity; scrollbar-width: none; }
[data-panel="content"] .ct-chips::-webkit-scrollbar { display: none; }
[data-panel="content"] .ct-chip { flex: 0 0 auto; scroll-snap-align: start; min-height: 44px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; padding: 4px 12px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; position: relative; }
[data-panel="content"] .ct-chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--on-soft); }
[data-panel="content"] .ct-chip.on .ct-chip-a, [data-panel="content"] .ct-chip.on .ct-chip-c { color: var(--on-soft); }
[data-panel="content"] .ct-chip-a { font-size: .72rem; font-weight: 700; letter-spacing: .3px; color: var(--ink-soft); }
[data-panel="content"] .ct-chip-b { font-size: .84rem; font-weight: 600; white-space: nowrap; }
[data-panel="content"] .ct-chip-c { position: absolute; top: 4px; right: 8px; font-size: .66rem; font-weight: 700; color: var(--ink-soft); }
[data-panel="content"] .ct-chip { padding-right: 34px; }
[data-panel="content"] .ct-chip-sm { flex-direction: row; align-items: center; padding: 4px 14px; border-radius: 999px; font-size: .84rem; font-weight: 600; }

[data-panel="content"] .ct-sesshead { display: flex; justify-content: space-between; align-items: baseline; gap: var(--u); flex-wrap: wrap; margin: calc(var(--u)*0.5) 0 var(--u); font-size: .92rem; }
[data-panel="content"] .ct-sesshead .muted { font-size: .8rem; }
[data-panel="content"] .ct-note { background: var(--card); border: 1px dashed var(--ember); border-radius: 12px; padding: calc(var(--u)*1.25) calc(var(--u)*1.5); font-size: .84rem; margin-bottom: calc(var(--u)*1.5); line-height: 1.45; }

/* concept cards */
[data-panel="content"] .ct-card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: calc(var(--u)*1.25); overflow: hidden; }
[data-panel="content"] .ct-card.is-done { border-left: 4px solid var(--good); }
[data-panel="content"] .ct-ch { width: 100%; min-height: 56px; display: flex; align-items: center; gap: var(--u); padding: calc(var(--u)*1.5) calc(var(--u)*1.75); background: none; border: 0; text-align: left; cursor: pointer; }
[data-panel="content"] .ct-ct { flex: 1 1 auto; min-width: 0; display: block; }
[data-panel="content"] .ct-ctitle { display: block; font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
[data-panel="content"] .ct-csum { display: block; font-size: .8rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }
[data-panel="content"] .ct-chk { display: none; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: var(--on-brand); font-size: .8rem; font-weight: 700; align-items: center; justify-content: center; }
[data-panel="content"] .ct-card.is-done .ct-chk { display: inline-flex; }
[data-panel="content"] .ct-chev { flex: 0 0 auto; font-size: 1.1rem; color: var(--ink-soft); transition: transform .15s; }
[data-panel="content"] .ct-ch[aria-expanded="true"] .ct-chev { transform: rotate(180deg); }
[data-panel="content"] .ct-cb { padding: 0 calc(var(--u)*1.75) calc(var(--u)*1.75); font-size: .93rem; line-height: 1.55; }
[data-panel="content"] .ct-cb p { margin: 0 0 var(--u); }
[data-panel="content"] .ct-cb ul { margin: 0 0 var(--u); padding-left: 1.2em; }
[data-panel="content"] .ct-cb li { margin-bottom: 6px; }
[data-panel="content"] .ct-cb b { font-weight: 700; }

[data-panel="content"] .ct-link { display: inline; padding: 0 1px; margin: 0; border: 0; background: none; font: inherit; color: var(--brand); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; font-weight: inherit; }
[data-panel="content"] .ct-calc { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: var(--u) calc(var(--u)*1.5); margin: 0 0 var(--u); font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; line-height: 1.5; }
[data-panel="content"] .ct-calc-t { font-size: .72rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
[data-panel="content"] .ct-key,
[data-panel="content"] .ct-trap { border-radius: 10px; padding: var(--u) calc(var(--u)*1.5); margin: 0 0 var(--u); font-size: .88rem; line-height: 1.5; }
[data-panel="content"] .ct-key { background: var(--brand-soft); color: var(--on-soft); border-left: 4px solid var(--ember); }
[data-panel="content"] .ct-trap { background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--warn); }
[data-panel="content"] .ct-tag { font-size: .68rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-right: 4px; }
[data-panel="content"] .ct-key .ct-tag { color: var(--ember-ink); }
[data-panel="content"] .ct-trap .ct-tag { color: var(--warn); }

[data-panel="content"] .ct-rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: var(--u) 0; }
[data-panel="content"] .ct-rel-l { font-size: .7rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
[data-panel="content"] .ct-tchip { min-height: 32px; padding: 4px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); font-size: .78rem; font-weight: 600; cursor: pointer; }
[data-panel="content"] .ct-done { width: 100%; min-height: 44px; margin-top: var(--u); border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); font-size: .9rem; font-weight: 600; cursor: pointer; }
[data-panel="content"] .ct-done[aria-pressed="true"] { border-color: var(--good); color: var(--good); }

/* glossary */
[data-panel="content"] .ct-search { position: relative; margin-bottom: var(--u); }
[data-panel="content"] .ct-q { width: 100%; min-height: 48px; padding: 0 44px 0 14px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--card); color: var(--ink); font-family: var(--body); font-size: 1rem; -webkit-appearance: none; appearance: none; }
[data-panel="content"] .ct-q::-webkit-search-cancel-button { display: none; }
[data-panel="content"] .ct-q:focus { border-color: var(--brand); outline: none; }

[data-panel="practice"] .pr-meta { display: flex; justify-content: space-between; align-items: center; gap: var(--u); margin-bottom: var(--u); }
[data-panel="practice"] .pr-box { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1.5px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
[data-panel="practice"] .pr-box.b1 { border-color: var(--warn); color: var(--warn); }
[data-panel="practice"] .pr-box.b2 { border-color: var(--ember); color: var(--ember-ink); }
[data-panel="practice"] .pr-box.b3 { border-color: var(--brand); color: var(--brand); }
[data-panel="practice"] .pr-box.b4, [data-panel="practice"] .pr-box.b5 { border-color: var(--good); color: var(--good); }

[data-panel="practice"] .pr-stage { perspective: 1200px; margin-bottom: calc(var(--u)*1.5); }
[data-panel="practice"] .pr-card {
  display: grid; position: relative; cursor: pointer; outline-offset: 3px; border-radius: var(--radius);
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.2,1);
}
[data-panel="practice"] .pr-card.flip { transform: rotateY(180deg); }
[data-panel="practice"] .pr-face {
  grid-area: 1 / 1; min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: var(--u);
  padding: calc(var(--u)*3) calc(var(--u)*2.5); border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--rule); box-shadow: 0 2px 10px rgba(10, 20, 40, .08);
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
}
[data-panel="practice"] .pr-face.pr-bk { transform: rotateY(180deg); background: var(--brand-soft); border-color: var(--brand); }
[data-panel="practice"] .pr-bk .pr-ans { color: var(--on-soft); }
[data-panel="practice"] .pr-tag { font-size: .7rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ember-ink); }
[data-panel="practice"] .pr-text { font-family: var(--display); font-size: var(--fs-lg); line-height: 1.35; font-weight: 600; color: var(--ink); }
[data-panel="practice"] .pr-ans { font-family: var(--body); font-size: 1.02rem; font-weight: 500; line-height: 1.55; }
[data-panel="practice"] .pr-tap { margin-top: var(--u); font-size: .78rem; color: var(--ink-soft); }

[data-panel="practice"] .pr-actions { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*1.25); }
[data-panel="practice"] .pr-again { background: var(--warn-soft); border: 2px solid var(--warn); color: var(--ink); }
[data-panel="practice"] .pr-got { background: var(--good-soft); border: 2px solid var(--good); color: var(--ink); }
[data-panel="practice"] .pr-show { margin-top: calc(var(--u)*1.25); background: var(--brand-deep); border: 2px solid var(--brand); }
[data-panel="practice"] .pr-show.gone { display: none; }
[data-panel="practice"] .pr-actions:not(.on) { display: none; }

/* done */
[data-panel="practice"] .pr-big { font-family: var(--display); font-size: 3rem; font-weight: 700; color: var(--brand); line-height: 1; }

@media (prefers-reduced-motion: reduce) {
  [data-panel="practice"] .pr-card { transition: none; }
  [data-panel="practice"] .pr-fill, [data-panel="practice"] .pr-prog span { transition: none; }
}

[data-panel="practice"] .pr-gloss { align-self: flex-start; min-height: 44px; padding: 0 calc(var(--u)*1.5); margin-top: var(--u); border-radius: 999px; border: 1.5px solid var(--brand); background: var(--card); color: var(--brand); font-size: .85rem; font-weight: 600; cursor: pointer; }

<script>
/* ---- GrantReady shell core. Defines window.SPA. Owned by the hub. ---- */
(function () {
  const TABS = [{id:"home",label:"Home",icon:"🏠"},{id:"content",label:"Content",icon:"📚"},{id:"schedule",label:"Schedule",icon:"🗓️"},{id:"methods",label:"Methods",icon:"🧭"},{id:"exercises",label:"Exercises",icon:"🧮"},{id:"homework",label:"Homework",icon:"📝"},{id:"practice",label:"Practice",icon:"🎴"}];
  const store = {
    get(k, d) { try { const v = localStorage.getItem("gr:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("gr:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const SPA = window.SPA = {
    tabs: {},            // each tab module registers: SPA.tabs.<id> = { render(panel), onShow?(panel) }
    TABS, store,
    cur: null,
    panels: {},
    esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); },
    // next/last session helpers (shared; Tuesdays 12:00 ET, Fall 2026)
    sessions: [
      { id:"spa1", code:"TC4011", title:"Proposal Preparation",  date:"2026-10-06" },
      { id:"spa2", code:"TC4012", title:"Budget Creation",        date:"2026-10-13" },
      { id:"spa3", code:"TC4013", title:"Managing the Award",     date:"2026-10-20" },
      { id:"spf1", code:"TC4014", title:"Financial Management",   date:"2026-10-27" },
      { id:"spf2", code:"TC4015", title:"Accounting & Closeout",  date:"2026-11-10" }
    ],
    go(id) {
      if (!id) return;
      if (SPA.tabs[id]) {
        if (SPA.cur === id) return;
        SPA.cur = id;
        for (const t of TABS) SPA.panels[t.id] && SPA.panels[t.id].classList.toggle("on", t.id === id);
        document.querySelectorAll("#tabbar button").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === id)));
        const mod = SPA.tabs[id];
        if (mod && !mod._rendered) { try { mod.render && mod.render(SPA.panels[id]); } catch (e) { console.error(id, e); } mod._rendered = true; }
        else if (mod && mod.onShow) { try { mod.onShow(SPA.panels[id]); } catch (e) { console.error(id, e); } }
        if (location.hash.slice(1) !== id) history.pushState({ tab: id }, "", "#" + id);
        window.scrollTo(0, 0);
      }
    }
  };

  function build() {
    const app = document.getElementById("app"), bar = document.getElementById("tabbar");
    for (const t of TABS) {
      const sec = document.createElement("section");
      sec.className = "panel"; sec.dataset.panel = t.id; sec.id = "panel-" + t.id;
      sec.innerHTML = '<div class="stub"><span class="big">' + t.icon + '</span>' + SPA.esc(t.label) +
        '<div class="muted" style="font-size:.85rem;margin-top:6px">Coming soon</div></div>';
      app.appendChild(sec); SPA.panels[t.id] = sec;

      const b = document.createElement("button");
      b.dataset.tab = t.id; b.type = "button";
      b.innerHTML = '<span class="ic">' + t.icon + '</span>' + SPA.esc(t.label);
      b.addEventListener("click", () => SPA.go(t.id));
      bar.appendChild(b);
    }
    window.addEventListener("popstate", () => { const h = location.hash.slice(1); if (h && SPA.tabs[h]) SPA.go(h); });
    const start = (location.hash.slice(1) && SPA.tabs[location.hash.slice(1)]) ? location.hash.slice(1) : (TABS[0] && TABS[0].id);
    SPA.cur = null; SPA.go(start);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
